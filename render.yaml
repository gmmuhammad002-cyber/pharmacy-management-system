services:
  - type: web
    name: eczane-sistemi
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: INITIAL_ADMIN_PASSWORD
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: eczane-db
          property: connectionString

  - type: psql
    name: eczane-db
    databaseName: eczane
    userName: eczane
