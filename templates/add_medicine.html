{% extends "base.html" %}

{% block title %}Add Medicine - Pharmacy{% endblock %}

{% block content %}

<div class="page-header">

    <div>
        <h1>Add Medicine</h1>
        <p>Add a new medicine to your inventory.</p>
    </div>

</div>


<div class="form-card">

    <form method="POST">

        <div class="form-grid">

            <div class="form-group">

                <label>Medicine Name</label>

                <input
                    type="text"
                    name="name"
                    placeholder="Example: Paracetamol"
                    required
                >

            </div>


            <div class="form-group">

                <label>Barcode</label>

                <input
                    type="text"
                    name="barcode"
                    placeholder="Enter barcode"
                    required
                >

            </div>


            <div class="form-group">

                <label>Category</label>

                <input
                    type="text"
                    name="category"
                    placeholder="Example: Painkiller"
                >

            </div>


            <div class="form-group">

                <label>Quantity</label>

                <input
                    type="number"
                    name="quantity"
                    min="0"
                    value="0"
                    required
                >

            </div>


            <div class="form-group">

                <label>Purchase Price</label>

                <input
                    type="number"
                    name="purchase_price"
                    min="0"
                    step="0.01"
                    value="0"
                    required
                >

            </div>


            <div class="form-group">

                <label>Selling Price</label>

                <input
                    type="number"
                    name="selling_price"
                    min="0"
                    step="0.01"
                    value="0"
                    required
                >

            </div>


            <div class="form-group">

                <label>Expiry Date</label>

                <input
                    type="date"
                    name="expiry_date"
                    required
                >

            </div>

        </div>


        <div class="form-actions">

            <a
                href="{{ url_for('medicines') }}"
                class="button secondary"
            >
                Cancel
            </a>

            <button
                type="submit"
                class="button primary"
            >
                Add Medicine
            </button>

        </div>

    </form>

</div>

{% endblock %}
