<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Server Error</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f7fa;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            color: #1f2937;
        }

        .error-box {
            background: white;
            padding: 40px;
            border-radius: 16px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
            max-width: 500px;
        }

        h1 {
            font-size: 64px;
            margin: 0;
        }

        h2 {
            margin-top: 10px;
        }

        p {
            color: #6b7280;
        }

        a {
            display: inline-block;
            margin-top: 20px;
            padding: 12px 20px;
            background: #0f766e;
            color: white;
            text-decoration: none;
            border-radius: 8px;
        }
    </style>
</head>

<body>

<div class="error-box">
    <h1>500</h1>
    <h2>Server Error</h2>
    <p>
        Something went wrong on the server.
        Please try again later.
    </p>

    <a href="/login">Back to Login</a>
</div>

</body>
</html>
