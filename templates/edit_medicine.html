{% extends "base.html" %}

{% block title %}Edit Medicine - Pharmacy{% endblock %}

{% block content %}

<div class="page-header">

    <div>
        <h1>Edit Medicine</h1>
        <p>Update medicine information.</p>
    </div>

</div>


<div class="form-card">

    <form method="POST">

        <div class="form-grid">

            <div class="form-group">

                <label>Medicine Name</label>

                <input
                    type="text"
                    name="name"
                    value="{{ medicine['name'] }}"
                    required
                >

            </div>


            <div class="form-group">

                <label>Barcode</label>

                <input
                    type="text"
                    name="barcode"
                    value="{{ medicine['barcode'] }}"
                    required
                >

            </div>


            <div class="form-group">

                <label>Category</label>

                <input
                    type="text"
                    name="category"
                    value="{{ medicine['category'] }}"
                >

            </div>


            <div class="form-group">

                <label>Quantity</label>

                <input
                    type="number"
                    name="quantity"
                    min="0"
                    value="{{ medicine['quantity'] }}"
                    required
                >

            </div>


            <div class="form-group">

                <label>Purchase Price</label>

                <input
                    type="number"
                    name="purchase_price"
                    min="0"
                    step="0.01"
                    value="{{ medicine['purchase_price'] }}"
                    required
                >

            </div>


            <div class="form-group">

                <label>Selling Price</label>

                <input
                    type="number"
                    name="selling_price"
                    min="0"
                    step="0.01"
                    value="{{ medicine['selling_price'] }}"
                    required
                >

            </div>


            <div class="form-group">

                <label>Expiry Date</label>

                <input
                    type="date"
                    name="expiry_date"
                    value="{{ medicine['expiry_date'] }}"
                    required
                >

            </div>

        </div>


        <div class="form-actions">

            <a
                href="{{ url_for('medicines') }}"
                class="button secondary"
            >
                Cancel
            </a>

            <button
                type="submit"
                class="button primary"
            >
                Save Changes
            </button>

        </div>

    </form>

</div>

{% endblock %}
